name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Both relevar_core.py modules import openpyxl at module load time,
          # so the offline parse test's import chain needs it.
          # Only the base deps: the audio extras (tiddl / yt-dlp / ffmpeg) are
          # deliberately NOT installed here — the tests are offline and must
          # pass without them, which also proves the graceful degradation.
          pip install streamlit openpyxl

      - name: Run offline parse test (root)
        run: python test_parse_description.py

      - name: Run offline parse test (web-app)
        run: python web-app/test_parse_description.py

      - name: Run product grouping + filters test
        run: python test_productos.py

      - name: Run pre-delivery validation test
        run: python test_validar.py

      - name: Run artwork resolution test
        run: python test_portadas.py

      - name: Run deliverable packaging test
        run: python test_paquete.py

      - name: Check modules import without the audio extras
        run: |
          python -c "import productos, portadas, audio, paquete; \
            e = audio.verificar_entorno(); \
            assert e['puede_flac'] is False, 'sin tiddl/ffmpeg no debe habilitar FLAC'; \
            print('degradacion correcta:', e)"
