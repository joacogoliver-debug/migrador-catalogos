name: build

# Compila la app para Windows, macOS y Linux.
#
# Se corre a mano o al publicar un tag vX.Y.Z. Los binarios se compilan acá, en
# GitHub, desde el código público: cualquiera puede leer el log y verificar que
# el ejecutable que descarga sale de este repo y no de la máquina de alguien.
#
# No se firma el binario (un certificado EV de Windows y la cuenta de Apple
# cuestan plata, y el proyecto es gratis). En su lugar publicamos el SHA256 y
# una atestación de procedencia, que es gratis y verificable con `gh attestation`.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write        # necesario para la atestación de procedencia
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        # Dos variantes por plataforma:
        #   completa = trae el modulo de audio Y ffmpeg adentro, asi no hay nada
        #              que instalar aparte. Pesa mas e incluye un binario GPLv3
        #              (ver build/terceros/FFMPEG-LICENCIA.txt).
        #   sin-audio = solo relevamiento, planilla, validacion y portadas.
        variante: [completa, sin-audio]
        include:
          - os: windows-latest
            nombre: windows
          - os: macos-latest
            nombre: macos
          - os: ubuntu-latest
            nombre: linux

    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.nombre }} · ${{ matrix.variante }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.13 y no 3.12: tiddl 3.x declara Requires-Python >=3.13, y en 3.12
          # pip resuelve a la 2.8.0, que no tiene la clase TidalAPI que usa el
          # modulo de audio. Se compilaba la variante sin audio y fallaba la
          # completa con "No matching distribution found for tiddl".
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt
          pip install pyinstaller

      - name: Instalar dependencias de audio
        if: matrix.variante == 'completa'
        # tiddl + yt-dlp + el ffmpeg que se empaqueta adentro.
        run: pip install -r requirements-audio.txt imageio-ffmpeg

      - name: Compilar
        # build.py corre los tests antes de empaquetar y aborta si alguno falla.
        run: python build/build.py ${{ matrix.variante == 'completa' && '--con-audio' || '' }}

      - name: Renombrar con la plataforma
        shell: bash
        env:
          SUFIJO: ${{ matrix.variante == 'completa' && 'completa' || 'sin-audio' }}
        run: |
          cd dist
          rm -f *.sha256
          for f in *; do
            base="${f%.exe}"
            ext=""
            [ "$f" != "$base" ] && ext=".exe"
            mv "$f" "Migrador-de-Catalogos-${{ matrix.nombre }}-${SUFIJO}${ext}"
          done
          ls -la

      - name: Publicar hash
        shell: bash
        run: |
          cd dist
          for f in Migrador-de-Catalogos-*; do
            if command -v sha256sum >/dev/null; then sha256sum "$f" | tee "$f.sha256";
            else shasum -a 256 "$f" | tee "$f.sha256"; fi
          done

      # Sólo corre en repos públicos: GitHub no permite atestaciones en repos
      # privados de cuentas personales ("Feature not available for user-owned
      # private repositories"). Mientras el repo sea privado se saltea y el
      # release igual sale con su SHA256; al pasarlo a público se activa solo.
      # continue-on-error además evita que un cambio de GitHub en esto bloquee
      # una publicación: la atestación es un extra, no el entregable.
      - name: Atestación de procedencia
        if: ${{ github.event.repository.private == false }}
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Migrador-de-Catalogos-*

      - uses: actions/upload-artifact@v4
        with:
          name: migrador-${{ matrix.nombre }}-${{ matrix.variante }}
          path: dist/*
          if-no-files-found: error

  publicar:
    # Sólo al empujar un tag: adjunta los binarios al release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Adjuntar al release
        uses: softprops/action-gh-release@v2
        with:
          files: artefactos/**/*
          generate_release_notes: true
          body: |
            ## Cuál bajar

            **`completa`** es la recomendada: trae el módulo de audio y **ffmpeg
            adentro**, así no hay que instalar nada aparte. Para bajar los audios
            en FLAC necesitás además tu propia cuenta paga de Tidal.

            **`sin-audio`** es más liviana y hace todo lo demás: relevamiento,
            planilla con ISRC y UPC, validación pre-entrega, hoja de ingesta y
            portadas.

            | Sistema | Completa | Sin audio |
            |---|---|---|
            | Windows | `Migrador-de-Catalogos-windows-completa.exe` | `...-windows-sin-audio.exe` |
            | macOS | `Migrador-de-Catalogos-macos-completa` | `...-macos-sin-audio` |
            | Linux | `Migrador-de-Catalogos-linux-completa` | `...-linux-sin-audio` |

            Bajás, abrís, y listo: no hay instalador. La primera vez te pide una
            clave de la YouTube Data API (gratis, se saca en Google Cloud
            Console) y queda guardada en tu máquina.

            La versión `completa` incluye FFmpeg, que es software de terceros bajo
            licencia GPLv3 y se distribuye sin modificaciones como programa
            separado. El detalle está en `build/terceros/FFMPEG-LICENCIA.txt`.

            ### El sistema va a avisar que el programa "no es reconocido"

            Es esperable: el binario no está firmado porque firmar cuesta plata y
            esto es gratis. El código es público y el ejecutable se compila acá
            en GitHub Actions desde ese código.

            - **Windows**: "Más información" → "Ejecutar de todas formas".
            - **macOS**: clic derecho → "Abrir", o Configuración → Privacidad y
              seguridad → "Abrir de todos modos".

            ### Verificar que el binario es el de este repo

            Compará el SHA256 con el `.sha256` publicado, o usá la atestación:

            ```
            gh attestation verify Migrador-de-Catalogos-windows.exe --repo ${{ github.repository }}
            ```
